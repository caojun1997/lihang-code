server:
  port: ${PORT:-3000}
  mode: ${GIN_MODE:-release}
  host: ${HOST:-0.0.0.0}

database:
  host: ${DB_HOST:-localhost}
  port: ${DB_PORT:-3306}
  username: ${DB_USERNAME:-root}
  password: ${DB_PASSWORD:-password}
  name: ${DB_NAME:-pdf_parser}
  max_idle_conns: 10
  max_open_conns: 100

redis:
  host: ${REDIS_HOST:-localhost}
  port: ${REDIS_PORT:-6379}
  password: ${REDIS_PASSWORD:-}
  db: ${REDIS_DB:-0}

minoru:
  mode: ${MINERU_MODE:-flash}
  base_url: ${MINERU_BASE_URL:-https://api.mineru.cn/api/v1}
  api_key: ${MINERU_API_KEY:-}
  timeout: ${MINERU_TIMEOUT:-120}

upload:
  max_size: ${UPLOAD_MAX_SIZE:-104857600}
  storage_path: ${UPLOAD_STORAGE_PATH:-./uploads}

oauth:
  client_id: ${OAUTH_CLIENT_ID:-}
  client_secret: ${OAUTH_CLIENT_SECRET:-}
  auth_url: ${OAUTH_AUTH_URL:-}
  token_url: ${OAUTH_TOKEN_URL:-}
  user_info_url: ${OAUTH_USER_INFO_URL:-}
  redirect_uri: ${OAUTH_REDIRECT_URI:-http://localhost:3000/api/v1/auth/callback}
  api_key_url: ${OAUTH_API_KEY_URL:-}
  logout_url: ${OAUTH_LOGOUT_URL:-}
  well_known_url: ${OAUTH_WELL_KNOWN_URL:-}
